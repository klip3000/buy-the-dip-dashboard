<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buy The Dip</title>
  <style>
    :root {
      --graphite: #616163;
      --mint: #44ffd2;
      --aqua: #87f6ff;
      --ice: #daf5ff;
      --peach: #ffbfa0;
      --paper: #f7fdff;
      --ink: #242528;
      --muted: #616163;
      --line: rgba(97, 97, 99, 0.2);
      --shadow: 0 24px 70px rgba(97, 97, 99, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(68, 255, 210, 0.28), transparent 34%),
        linear-gradient(315deg, rgba(255, 191, 160, 0.36), transparent 42%),
        linear-gradient(180deg, var(--ice), #ffffff 68%);
      font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--graphite);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(2.4rem, 6vw, 5.4rem);
      line-height: 0.94;
      letter-spacing: 0;
      font-weight: 900;
    }

    .meta {
      display: grid;
      gap: 10px;
      min-width: 240px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(247, 253, 255, 0.78);
      box-shadow: var(--shadow);
    }

    .meta strong {
      font-size: 1.7rem;
      line-height: 1;
    }

    .meta span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 14px;
      margin-bottom: 18px;
      padding: 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .search,
    .sort {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(247, 253, 255, 0.86);
      color: var(--ink);
    }

    .search {
      width: 100%;
      padding: 0 14px;
    }

    .sort {
      padding: 0 34px 0 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--line);
    }

    .summary-item {
      padding: 18px;
      background: rgba(247, 253, 255, 0.86);
    }

    .summary-item span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .summary-item strong {
      font-size: 1.6rem;
      line-height: 1;
    }

    .asset-list {
      display: grid;
      gap: 10px;
    }

    .asset-row {
      --metric-width: 96px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(247, 253, 255, 0.93);
      box-shadow: 0 10px 28px rgba(97, 97, 99, 0.08);
    }

    .asset-snapshot {
      display: grid;
      grid-template-columns: minmax(170px, 0.9fr) minmax(260px, 1.5fr) minmax(270px, 1fr) var(--metric-width);
      gap: 18px;
      align-items: center;
      padding: 16px;
    }

    .asset-row.unavailable {
      opacity: 0.72;
    }

    .asset-identity {
      min-width: 0;
    }

    .category {
      display: inline-block;
      margin-bottom: 7px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--graphite);
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .category-tr-grow {
      background: rgba(68, 255, 210, 0.24);
    }

    .category-comd-dividens {
      background: rgba(255, 191, 160, 0.32);
    }

    .category-scal-xtragrow {
      background: rgba(135, 246, 255, 0.32);
    }

    .symbol {
      margin: 0 0 5px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .state-key {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .instrument-link {
      color: #215e55;
      text-decoration: underline;
      text-underline-offset: 0.16em;
    }

    .instrument-link:focus-visible {
      outline: 2px solid #215e55;
      outline-offset: 4px;
    }

    .numbers {
      display: grid;
      gap: 9px;
    }

    .number-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .number-line strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .history-band,
    .score-band {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .history-band {
      background: rgba(218, 245, 255, 0.32);
    }

    .history-band:last-child,
    .score-band {
      border-radius: 0 0 7px 7px;
    }

    .score-band {
      background: rgba(247, 253, 255, 0.84);
    }

    .score-label {
      display: block;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .history-detail {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-weight: 700;
    }

    .history-months,
    .score-value {
      width: var(--metric-width);
      color: var(--ink);
      text-align: center;
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
    }

    .score-value small {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(97, 97, 99, 0.14);
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--aqua));
    }

    .bar span.dip-low {
      background: linear-gradient(90deg, var(--ice), var(--aqua));
    }

    .bar span.dip-watch {
      background: linear-gradient(90deg, var(--aqua), var(--ice));
    }

    .bar span.dip-good {
      background: linear-gradient(90deg, var(--mint), var(--ice));
    }

    .bar span.dip-deep {
      background: linear-gradient(90deg, var(--mint), #26d9b8);
    }

    .drawdown {
      display: grid;
      justify-self: end;
      width: var(--metric-width);
      padding: 9px 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: rgba(68, 255, 210, 0.24);
      color: #267b6b;
    }

    .drawdown-label {
      font-size: 0.72rem;
      font-weight: 600;
    }

    .drawdown.dip-low {
      background: rgba(135, 246, 255, 0.46);
      color: #236b72;
    }

    .drawdown.dip-watch {
      background: rgba(218, 245, 255, 0.82);
      color: #356f80;
    }

    .drawdown.dip-good {
      background: rgba(68, 255, 210, 0.26);
      color: #267b6b;
    }

    .drawdown.dip-deep {
      background: rgba(68, 255, 210, 0.52);
      color: #176b5a;
    }

    .empty {
      display: none;
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: rgba(247, 253, 255, 0.72);
    }

    @media (max-width: 920px) {
      .masthead,
      .toolbar,
      .summary {
        grid-template-columns: 1fr;
      }

      .meta {
        min-width: 0;
      }

      .asset-snapshot {
        grid-template-columns: minmax(0, 1fr) var(--metric-width);
        gap: 12px;
      }

      .asset-snapshot > .name,
      .asset-snapshot > .numbers {
        grid-column: 1 / -1;
      }

      .asset-snapshot > .drawdown {
        grid-area: 1 / 2;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 26px;
      }

      .asset-snapshot {
        padding: 14px;
      }

      .history-band,
      .score-band {
        padding-inline: 14px;
      }

      h1 {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">All-time-high tracker</p>
        <h1>Buy The Dip</h1>
      </div>
      <aside class="meta" aria-label="Dashboard summary">
        <span>Last updated</span>
        <strong id="updatedTime">11:17 CEST</strong>
        <span id="updatedDate">20 Aug 2026 · sample data only</span>
      </aside>
    </header>

    <section class="summary" aria-label="Portfolio snapshot">
      <div class="summary-item">
        <span>Tracked assets</span>
        <strong id="assetCount">0</strong>
      </div>
      <div class="summary-item">
        <span>Average drawdown</span>
        <strong id="averageDrawdown">0.00%</strong>
      </div>
      <div class="summary-item">
        <span>Deepest drawdown</span>
        <strong id="deepestDrawdown">0.00%</strong>
      </div>
    </section>

    <section class="toolbar" aria-label="Dashboard controls">
      <input class="search" id="searchInput" type="search" placeholder="Search symbol or name">
      <select class="sort" id="sortSelect" aria-label="Sort assets">
        <option value="drawdown-desc">Biggest drawdown first</option>
        <option value="ratio-desc">Closest to ATH first</option>
        <option value="symbol-asc">Symbol A-Z</option>
        <option value="name-asc">Name A-Z</option>
      </select>
    </section>

    <section class="asset-list" id="assetList" aria-label="ATH assets"></section>
    <p class="empty" id="emptyState">No assets match this search.</p>
  </main>

  <script>
    const fallbackDashboardData = {
      updatedAtLabel: "20 Aug 2026 · sample data only",
      updatedTimeLabel: "11:17 CEST",
      assets: [
      {
        symbol: "0P0001L3X8.F",
        key: "0P0001L3X8.F",
        name: "BIT Global Leaders R - I",
        category: "SCAL-XTRAGROW",
        price: 270.24,
        ath: 329.32,
        currency: "EUR"
      },
      {
        symbol: "0P0001RI0F.F",
        key: "0P0001RI0F.F",
        name: "BIT Global Technology Leaders R-II",
        category: "SCAL-XTRAGROW",
        price: 275.00,
        ath: 333.14,
        currency: "EUR"
      },
      {
        symbol: "IS3N.DE",
        key: "IE00BKM4GZ66",
        name: "iShares Core MSCI Emerging Markets IMI UCITS ETF Acc",
        category: "TR-GROW",
        price: 43.54,
        ath: 50.69,
        currency: "EUR"
      },
      {
        symbol: "MWOW.DE",
        key: "IE0005E8B9S4",
        name: "Amundi Russell 1000 Growth UCITS ETF Acc",
        category: "TR-GROW",
        price: 503.30,
        ath: 555.20,
        currency: "EUR"
      },
      {
        symbol: "DBXJ.DE",
        key: "IE00B53QDK08",
        name: "Xtrackers MSCI Japan UCITS ETF",
        category: "TR-GROW",
        price: 97.87,
        ath: 106.51,
        currency: "EUR"
      },
      {
        symbol: "C001.DE",
        key: "LU2611732046",
        name: "Amundi DAX UCITS ETF",
        category: "COMD-DIVIDENS",
        price: 189.02,
        ath: 195.48,
        currency: "EUR"
      },
      {
        symbol: "FGQI.L",
        key: "IE00BYXVGZ48",
        name: "Fidelity Global Quality Income UCITS ETF INC-USD",
        category: "COMD-DIVIDENS",
        price: 11.53,
        ath: 11.95,
        currency: "USD"
      }
      ]
    };

    let dashboardData = fallbackDashboardData;
    let sampleAssets = dashboardData.assets || [];

    const assetList = document.querySelector("#assetList");
    const emptyState = document.querySelector("#emptyState");
    const searchInput = document.querySelector("#searchInput");
    const sortSelect = document.querySelector("#sortSelect");
    const assetCount = document.querySelector("#assetCount");
    const averageDrawdown = document.querySelector("#averageDrawdown");
    const deepestDrawdown = document.querySelector("#deepestDrawdown");
    const updatedTime = document.querySelector("#updatedTime");
    const updatedDate = document.querySelector("#updatedDate");

    function metrics(asset) {
      if (asset.price == null || asset.ath == null || asset.ath <= 0) {
        return { ratio: 0, drawdown: 0 };
      }
      const ratio = asset.ath > 0 ? asset.price / asset.ath : 0;
      const drawdown = Math.max(0, (1 - ratio) * 100);
      return { ratio, drawdown };
    }

    function formatMoney(value, currency) {
      if (value == null) return "N/A";
      return `${value.toFixed(2)} ${currency}`;
    }

    function drawdownClass(drawdown) {
      if (drawdown >= 23) return "dip-deep";
      if (drawdown >= 16) return "dip-good";
      if (drawdown >= 9) return "dip-watch";
      return "dip-low";
    }

    function categoryClass(category) {
      const classes = {
        "TR-GROW": "category-tr-grow",
        "COMD-DIVIDENS": "category-comd-dividens",
        "SCAL-XTRAGROW": "category-scal-xtragrow"
      };
      return classes[category] || "";
    }

    const fundChartUrls = new Map([
      ["0P0001L3X8.F", "https://www.onvista.de/fonds/chart/BIT-GLOBAL-LEADERS-R-I-EUR-ACC-Fonds-DE000A2QDRW2"],
      ["0P0001RI0F.F", "https://www.onvista.de/fonds/chart/BIT-GLOBAL-INTERNET-LEADERS-30-INHABER-ANTEILE-R-II-Fonds-DE000A3DV756"]
    ]);

    function instrumentUrl(asset) {
      const chartUrl = fundChartUrls.get(asset.symbol);
      if (chartUrl) return chartUrl;

      // DBXJ.DE uses the old iShares ISIN as its ATH storage key.
      const isin = asset.symbol === "DBXJ.DE" ? "LU0274209740" : asset.key;
      if (!/\bETF\b/i.test(asset.name) || !/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(isin)) {
        return null;
      }
      return `https://www.justetf.com/en-de/etf-profile.html?isin=${isin}`;
    }

    function assetNameTemplate(asset) {
      const url = instrumentUrl(asset);
      const name = url
        ? `<a class="instrument-link" href="${url}" target="_blank" rel="noopener noreferrer">${asset.name}</a>`
        : asset.name;
      return `<p class="name">${name}</p>`;
    }

    const historyDateFormat = new Intl.DateTimeFormat("en-GB", {
      day: "numeric", month: "short", year: "numeric", timeZone: "UTC"
    });

    function priceHistoryTemplate(asset) {
      const level = asset.firstPriceLevel;
      if (!level) return "";
      let detail;
      let age = "";
      switch (level.status) {
        case "found":
          detail = `First recorded close at or above this level
            <span class="history-detail">${historyDateFormat.format(new Date(level.date))} &middot; ${formatMoney(level.close, asset.currency)}</span>`;
          if (Number.isInteger(level.monthsAgo) && level.monthsAgo >= 0) {
            const unit = level.monthsAgo === 1 ? "month" : "months";
            age = `<strong class="history-months" aria-label="${level.monthsAgo} full ${unit} ago">${level.monthsAgo}M</strong>`;
          }
          break;
        case "at_history_start":
          detail = `Already at or above this level when available history starts (${historyDateFormat.format(new Date(level.historyStart))})`;
          break;
        case "not_reached":
          detail = "No earlier close at or above this level in available history";
          break;
        default:
          detail = "Price history unavailable";
      }
      return `<div class="history-band"><div>${detail}</div>${age}</div>`;
    }

    const tradingDayFormat = new Intl.NumberFormat("en-GB");

    function dipRarityTemplate(asset) {
      const score = asset.dipScore;
      const available = Number.isInteger(score) && score >= 0 && score <= 100;
      const days = asset.dipScoreDays;
      let detail = available ? "" : "Not enough historical data.";
      if (available && Number.isInteger(days?.asDeep) && Number.isInteger(days?.total) && days.total > 0) {
        const prefix = days.asDeep / days.total <= 0.1 ? "Only " : "";
        detail = `${prefix}${tradingDayFormat.format(days.asDeep)} of ${tradingDayFormat.format(days.total)} past trading days had a dip this deep or deeper.`;
      }
      return `<div class="score-band">
        <div><strong class="score-label">Dip Rarity</strong>${detail}</div>
        <strong class="score-value" aria-label="${available ? `${score} out of 100` : "Score unavailable"}">${available ? `${score}<small>/100</small>` : "&ndash;"}</strong>
      </div>`;
    }

    function rowTemplate(asset) {
      const category = asset.category || "UNASSIGNED";
      const { ratio, drawdown } = metrics(asset);
      const percentageOfAth = Math.min(100, Math.max(0, ratio * 100)).toFixed(2);
      const severity = drawdownClass(drawdown);
      const unavailable = Boolean(asset.error);

      return `
        <article class="asset-row${unavailable ? " unavailable" : ""}">
          <div class="asset-snapshot">
            <div class="asset-identity">
              <span class="category ${categoryClass(category)}">${category}</span>
              <p class="symbol">${asset.symbol}</p>
              <span class="state-key">${asset.key}</span>
            </div>
            ${assetNameTemplate(asset)}
            <div class="numbers">
              <div class="number-line">
                <span>Price <strong>${formatMoney(asset.price, asset.currency)}</strong></span>
                <span>ATH <strong>${formatMoney(asset.ath, asset.currency)}</strong></span>
              </div>
              <div class="bar" aria-label="${unavailable ? "No current price available" : `${percentageOfAth} percent of ATH`}">
                <span class="${severity}" style="width: ${percentageOfAth}%"></span>
              </div>
              <div class="number-line">
                <span>${unavailable ? asset.error : `${percentageOfAth}% of ATH`}</span>
              </div>
            </div>
            <div class="drawdown${unavailable ? "" : ` ${severity}`}">
              ${unavailable ? "N/A" : `${drawdown.toFixed(2)}%<span class="drawdown-label">below ATH</span>`}
            </div>
          </div>
          ${unavailable ? "" : priceHistoryTemplate(asset)}
          ${unavailable ? "" : dipRarityTemplate(asset)}
        </article>
      `;
    }

    function filteredAssets() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = sampleAssets.filter((asset) => {
        return `${asset.category || ""} ${asset.symbol} ${asset.name} ${asset.key}`.toLowerCase().includes(query);
      });

      return filtered.sort((a, b) => {
        const aMetrics = metrics(a);
        const bMetrics = metrics(b);
        switch (sortSelect.value) {
          case "ratio-desc":
            return bMetrics.ratio - aMetrics.ratio;
          case "symbol-asc":
            return a.symbol.localeCompare(b.symbol);
          case "name-asc":
            return a.name.localeCompare(b.name);
          default:
            return bMetrics.drawdown - aMetrics.drawdown;
        }
      });
    }

    function render() {
      const assets = filteredAssets();
      const allMetrics = sampleAssets.map(metrics);
      const totalDrawdown = allMetrics.reduce((sum, item) => sum + item.drawdown, 0);
      const maxDrawdown = Math.max(...allMetrics.map((item) => item.drawdown));

      assetCount.textContent = sampleAssets.length.toString();
      averageDrawdown.textContent = sampleAssets.length ? `${(totalDrawdown / sampleAssets.length).toFixed(2)}%` : "0.00%";
      deepestDrawdown.textContent = Number.isFinite(maxDrawdown) ? `${maxDrawdown.toFixed(2)}%` : "0.00%";
      updatedTime.textContent = dashboardData.updatedTimeLabel || "N/A";
      updatedDate.textContent = dashboardData.updatedAtLabel || "sample data only";

      assetList.innerHTML = assets.map(rowTemplate).join("");
      emptyState.style.display = assets.length ? "none" : "block";
    }

    async function loadDashboardData() {
      try {
        const response = await fetch(`data.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Dashboard data request failed with ${response.status}`);
        }
        dashboardData = await response.json();
        sampleAssets = dashboardData.assets || [];
      } catch (error) {
        console.warn("Using fallback dashboard data:", error);
      }
      render();
    }

    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        loadDashboardData();
      }
    });
    window.addEventListener("focus", loadDashboardData);
    loadDashboardData();
  </script>
</body>
</html>
